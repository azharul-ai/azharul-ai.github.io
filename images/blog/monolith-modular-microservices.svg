<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Monolith, modular monolith, or microservices?</title>
  <desc id="description">A three-column comparison of monolith, modular monolith, and microservices architecture options.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#152b47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="1090" cy="35" r="190" fill="#38bdf8" opacity="0.08"/>
  <circle cx="90" cy="630" r="220" fill="#818cf8" opacity="0.08"/>

  <text x="70" y="82" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Monolith, modular monolith, or microservices?</text>
  <text x="70" y="121" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">Choose from evidence—not architecture fashion.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="70" y="178" width="325" height="330" rx="22" fill="#10233d" stroke="#294767"/>
    <rect x="438" y="162" width="325" height="362" rx="22" fill="#132c4b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="806" y="178" width="325" height="330" rx="22" fill="#10233d" stroke="#294767"/>

    <rect x="92" y="200" width="48" height="8" rx="4" fill="#64748b"/>
    <text x="92" y="253" fill="#f8fafc" font-size="25" font-weight="700">Monolith</text>
    <text x="92" y="294" fill="#cbd5e1" font-size="17">
      <tspan x="92" dy="0">One deployment unit</tspan>
      <tspan x="92" dy="34">Simpler operations</tspan>
      <tspan x="92" dy="34">Scale together</tspan>
      <tspan x="92" dy="34">Boundaries need discipline</tspan>
    </text>
    <text x="92" y="461" fill="#94a3b8" font-size="15">Strong fit: simple product or domain</text>

    <rect x="460" y="184" width="48" height="8" rx="4" fill="url(#accent)"/>
    <text x="460" y="237" fill="#f8fafc" font-size="25" font-weight="700">Modular monolith</text>
    <text x="460" y="278" fill="#cbd5e1" font-size="17">
      <tspan x="460" dy="0">One deployment unit</tspan>
      <tspan x="460" dy="34">Explicit module contracts</tspan>
      <tspan x="460" dy="34">Clear data ownership</tspan>
      <tspan x="460" dy="34">Lower operational cost</tspan>
    </text>
    <rect x="460" y="422" width="160" height="34" rx="17" fill="#0b1d33" stroke="#38bdf8"/>
    <text x="540" y="444" text-anchor="middle" fill="#7dd3fc" font-size="14" font-weight="700">PRACTICAL DEFAULT</text>
    <text x="460" y="488" fill="#94a3b8" font-size="15">Strong fit: evolving product, few teams</text>

    <rect x="828" y="200" width="48" height="8" rx="4" fill="#818cf8"/>
    <text x="828" y="253" fill="#f8fafc" font-size="25" font-weight="700">Microservices</text>
    <text x="828" y="294" fill="#cbd5e1" font-size="17">
      <tspan x="828" dy="0">Independent deployment</tspan>
      <tspan x="828" dy="34">Independent scaling</tspan>
      <tspan x="828" dy="34">Network failure modes</tspan>
      <tspan x="828" dy="34">Highest operational cost</tspan>
    </text>
    <text x="828" y="461" fill="#94a3b8" font-size="15">Strong fit: proven team autonomy needs</text>
  </g>

  <rect x="70" y="552" width="1061" height="40" rx="12" fill="#0b1d33" stroke="#294767"/>
  <text x="600" y="578" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">The simplest architecture that meets known needs is usually the right starting point.</text>
</svg>
