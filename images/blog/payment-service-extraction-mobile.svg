<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="title description">
  <title id="title">Evidence-based payment service extraction on mobile</title>
  <desc id="description">A vertical architecture diagram. A modular commerce application contains four modules. Compliance, release, and scaling evidence leads downward to an independent payment service with its own data, contract, retry handling, and failure boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#142b48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="360" height="900" rx="22" fill="url(#background)"/>
  <circle cx="338" cy="18" r="80" fill="#38bdf8" opacity="0.07"/>
  <circle cx="18" cy="890" r="85" fill="#818cf8" opacity="0.07"/>

  <text x="20" y="34" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Extract when the boundary becomes real</text>
  <text x="20" y="54" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="10">Clear modules first. A network boundary needs evidence.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="15" y="76" width="330" height="278" rx="18" fill="#0d2038" stroke="#49647f" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="31" y="101" fill="#7dd3fc" font-size="9" font-weight="800" letter-spacing="0.8">SYSTEM BOUNDARY · ONE DEPLOYMENT</text>
    <text x="31" y="126" fill="#f8fafc" font-size="15" font-weight="700">Modular commerce application</text>

    <rect x="31" y="148" width="141" height="72" rx="12" fill="#142c49" stroke="#294767"/>
    <text x="101" y="180" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Catalogue</text>
    <text x="101" y="199" text-anchor="middle" fill="#94a3b8" font-size="9">Owns product data</text>

    <rect x="188" y="148" width="141" height="72" rx="12" fill="#142c49" stroke="#294767"/>
    <text x="258" y="180" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Ordering</text>
    <text x="258" y="199" text-anchor="middle" fill="#94a3b8" font-size="9">Coordinates checkout</text>

    <rect x="31" y="238" width="141" height="88" rx="12" fill="#153456" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="42" y="249" width="54" height="18" rx="9" fill="#08243a"/>
    <text x="69" y="262" text-anchor="middle" fill="#7dd3fc" font-size="7" font-weight="800">CANDIDATE</text>
    <text x="101" y="288" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Payment</text>
    <text x="101" y="307" text-anchor="middle" fill="#94a3b8" font-size="9">Clear module contract</text>

    <rect x="188" y="238" width="141" height="88" rx="12" fill="#142c49" stroke="#294767"/>
    <text x="258" y="278" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Notification</text>
    <text x="258" y="297" text-anchor="middle" fill="#94a3b8" font-size="9">Customer messages</text>
  </g>

  <path d="M 101 326 C 101 375, 180 363, 180 397" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <polygon points="180,388 250,458 180,528 110,458" fill="#112b48" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="180" y="433" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Evidence</text>
    <text x="180" y="455" text-anchor="middle" fill="#cbd5e1" font-size="10">Compliance boundary</text>
    <text x="180" y="473" text-anchor="middle" fill="#cbd5e1" font-size="10">Independent releases</text>
    <text x="180" y="491" text-anchor="middle" fill="#cbd5e1" font-size="10">Different scaling</text>
  </g>

  <path d="M 180 530 V 573" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="35" y="585" width="290" height="235" rx="18" fill="#122d4c" stroke="#818cf8" stroke-width="1.5"/>
    <text x="54" y="613" fill="#a5b4fc" font-size="9" font-weight="800" letter-spacing="0.8">INDEPENDENT BOUNDARY</text>
    <text x="54" y="644" fill="#f8fafc" font-size="18" font-weight="700">Payment service</text>

    <circle cx="59" cy="681" r="4" fill="#38bdf8"/>
    <text x="74" y="686" fill="#e2e8f0" font-size="12">Owns payment data</text>
    <circle cx="59" cy="716" r="4" fill="#38bdf8"/>
    <text x="74" y="721" fill="#e2e8f0" font-size="12">Exposes a versioned contract</text>
    <circle cx="59" cy="751" r="4" fill="#38bdf8"/>
    <text x="74" y="756" fill="#e2e8f0" font-size="12">Handles retries and idempotency</text>
    <circle cx="59" cy="786" r="4" fill="#38bdf8"/>
    <text x="74" y="791" fill="#e2e8f0" font-size="12">Can fail independently</text>
  </g>

  <rect x="15" y="846" width="330" height="34" rx="10" fill="#0b1d33" stroke="#294767"/>
  <text x="180" y="860" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600">New boundary = network calls, uncertain outcomes,</text>
  <text x="180" y="872" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="8" font-weight="600">monitoring, and operational ownership.</text>
</svg>
