<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">From requirements to a practical high-level design</title>
  <desc id="description">A left-to-right process connecting business outcomes, quality attributes and constraints, component boundaries and data flow, and operational risks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#132a46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#background)"/>
  <circle cx="1080" cy="65" r="180" fill="#38bdf8" opacity="0.08"/>
  <circle cx="120" cy="610" r="210" fill="#818cf8" opacity="0.08"/>

  <text x="72" y="88" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">From requirements to design decisions</text>
  <text x="72" y="126" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="20">A practical HLD makes the reasoning, flow and risks visible.</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="70" y="196" width="230" height="260" rx="22" fill="#10233d" stroke="#294767"/>
    <rect x="90" y="218" width="48" height="8" rx="4" fill="url(#accent)"/>
    <text x="90" y="270" fill="#f8fafc" font-size="23" font-weight="700">1. Outcomes</text>
    <text x="90" y="310" fill="#cbd5e1" font-size="17">
      <tspan x="90" dy="0">Business goal</tspan>
      <tspan x="90" dy="32">Users and rules</tspan>
      <tspan x="90" dy="32">Failure cases</tspan>
      <tspan x="90" dy="32">Success measures</tspan>
    </text>

    <rect x="350" y="196" width="230" height="260" rx="22" fill="#10233d" stroke="#294767"/>
    <rect x="370" y="218" width="48" height="8" rx="4" fill="url(#accent)"/>
    <text x="370" y="270" fill="#f8fafc" font-size="23" font-weight="700">2. Drivers</text>
    <text x="370" y="310" fill="#cbd5e1" font-size="17">
      <tspan x="370" dy="0">Quality attributes</tspan>
      <tspan x="370" dy="32">Constraints</tspan>
      <tspan x="370" dy="32">Load and latency</tspan>
      <tspan x="370" dy="32">Security needs</tspan>
    </text>

    <rect x="630" y="196" width="230" height="260" rx="22" fill="#10233d" stroke="#294767"/>
    <rect x="650" y="218" width="48" height="8" rx="4" fill="url(#accent)"/>
    <text x="650" y="270" fill="#f8fafc" font-size="23" font-weight="700">3. Design</text>
    <text x="650" y="310" fill="#cbd5e1" font-size="17">
      <tspan x="650" dy="0">Responsibilities</tspan>
      <tspan x="650" dy="32">Boundaries</tspan>
      <tspan x="650" dy="32">Data ownership</tspan>
      <tspan x="650" dy="32">End-to-end flow</tspan>
    </text>

    <rect x="910" y="196" width="230" height="260" rx="22" fill="#10233d" stroke="#294767"/>
    <rect x="930" y="218" width="48" height="8" rx="4" fill="url(#accent)"/>
    <text x="930" y="270" fill="#f8fafc" font-size="23" font-weight="700">4. Review</text>
    <text x="930" y="310" fill="#cbd5e1" font-size="17">
      <tspan x="930" dy="0">Timeouts and retries</tspan>
      <tspan x="930" dy="32">Operational signals</tspan>
      <tspan x="930" dy="32">Trade-offs</tspan>
      <tspan x="930" dy="32">Open risks</tspan>
    </text>
  </g>

  <g stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 306 326 H 338"/>
    <path d="M 586 326 H 618"/>
    <path d="M 866 326 H 898"/>
  </g>

  <rect x="70" y="510" width="1070" height="62" rx="16" fill="#0b1d33" stroke="#294767"/>
  <text x="605" y="549" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Every box should trace back to a requirement, constraint or known risk.</text>
</svg>
